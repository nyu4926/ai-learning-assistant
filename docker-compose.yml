version: "3.8"

services:
  app:
    build: ./backend
    container_name: ai-assistant
    ports:
      - "5000:5000"
    volumes:
      - db_data:/app/instance
      - chroma_data:/app/chroma_data
      - uploads_data:/app/uploads
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-to-a-random-string}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - EMBEDDING_API_BASE=${EMBEDDING_API_BASE:-https://api.openai.com/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - DATABASE_URL=
      - CHROMA_PERSIST_DIR=/app/chroma_data
    restart: unless-stopped

volumes:
  db_data:
  chroma_data:
  uploads_data:
